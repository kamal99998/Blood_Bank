name: CD (Deploy to VPS)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy Blood Bank
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            echo "Starting Blood Bank Deployment"

            APP_DIR="/root/blood_bank"
            REPO_URL="https://github.com/kamal99998/Blood_Bank.git"
            BRANCH="dev"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning repository..."
              git clone -b "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "Getting latest code..."
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "Installing dependencies..."
            npm ci --omit=dev

            echo "Starting MySQL..."
            docker compose up -d db

            echo "Waiting for MySQL..."
            for i in {1..30}; do
              if docker compose exec -T db mysqladmin ping -h localhost -uroot -proot --silent; then
                echo "MySQL is ready!"
                break
              fi

              echo "Waiting for MySQL..."
              sleep 2
            done

            echo "Restarting application..."

            if pm2 describe blood-bank > /dev/null 2>&1; then
              pm2 restart blood-bank
            else
              pm2 start app.js --name blood-bank
            fi

            pm2 save

            docker image prune -f

            echo "Deployment Successful!"