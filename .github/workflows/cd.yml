```yaml
name: CD (Deploy to VPS)

on:
  push:
    branches: ["dev"]

jobs:

  deploy:
    name: Deploy Blood Bank
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Deploy through SSH
      # ==========================================
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |

            set -e

            echo "======================================"
            echo "Starting Blood Bank Deployment"
            echo "======================================"

            # ------------------------------------
            # Application directory
            # ------------------------------------

            APP_DIR="/root/blood_bank"

            # ------------------------------------
            # Clone repository if it doesn't exist
            # ------------------------------------

            if [ ! -d "$APP_DIR/.git" ]; then

              echo "Application directory not found."
              echo "Cloning repository..."

              git clone \
                -b dev \
                https://github.com/kamal99998/Blood_Bank.git \
                "$APP_DIR"

            fi

            cd "$APP_DIR"

            # ------------------------------------
            # Get latest code
            # ------------------------------------

            echo "Fetching latest code..."

            git fetch origin dev

            git checkout dev

            git reset --hard origin/dev

            # ------------------------------------
            # Create .env
            # ------------------------------------

            echo "Creating environment file..."

            cat <<EOF > .env

DB_HOST=${{ secrets.DB_HOST }}
DB_PORT=${{ secrets.DB_PORT }}
DB_USER=${{ secrets.DB_USER }}
DB_PASSWORD=${{ secrets.DB_PASSWORD }}
DB_NAME=${{ secrets.DB_NAME }}

PORT=${{ secrets.APP_PORT }}

EOF

            # ------------------------------------
            # Install dependencies
            # ------------------------------------

            echo "Installing dependencies..."

            npm ci --omit=dev

            # ------------------------------------
            # Start / restart MySQL
            # ------------------------------------

            echo "Starting MySQL..."

            docker compose up -d db

            # ------------------------------------
            # Wait for MySQL
            # ------------------------------------

            echo "Waiting for MySQL..."

            for i in {1..30}; do

              if docker exec mysql-db \
                mysqladmin ping \
                -h 127.0.0.1 \
                -uroot \
                -proot \
                --silent; then

                echo "MySQL is ready!"
                break

              fi

              echo "Waiting for MySQL..."
              sleep 2

            done

            # ------------------------------------
            # Restart application with PM2
            # ------------------------------------

            echo "Restarting Blood Bank application..."

            if pm2 list | grep -q "blood-bank"; then

              pm2 restart blood-bank

            else

              pm2 start app.js --name blood-bank

            fi

            pm2 save

            # ------------------------------------
            # Cleanup unused Docker images
            # ------------------------------------

            docker image prune -f

            echo "======================================"
            echo "Blood Bank Deployment Successful!"
            echo "======================================"
```
