```yaml
name: CI (Build & Test)

on:
  push:
    branches: ["dev", "main"]

  pull_request:
    branches: ["dev", "main"]

jobs:

  # ==========================================
  # BUILD
  # ==========================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker Environment
        run: docker compose build


  # ==========================================
  # TEST
  # ==========================================
  test:
    name: Test Application
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      # ======================================
      # Start MySQL
      # ======================================
      - name: Start MySQL Container
        run: |
          docker compose up -d db

      # ======================================
      # Wait for MySQL
      # ======================================
      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL..."

          for i in {1..30}; do
            if docker exec mysql-db \
              mysqladmin ping \
              -h 127.0.0.1 \
              -uroot \
              -proot \
              --silent; then

              echo "MySQL is ready!"
              break
            fi

            echo "MySQL is not ready yet..."
            sleep 2
          done

      # ======================================
      # Run Jest Tests
      # ======================================
      - name: Run Jest Tests
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASSWORD: "root"
          DB_NAME: "blood_bank"
        run: npm test

      # ======================================
      # Cleanup
      # ======================================
      - name: Stop Docker
        if: always()
        run: docker compose down -v
```
