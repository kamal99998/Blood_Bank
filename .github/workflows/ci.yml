name: CI (Build & Test)

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker Environment
        run: docker compose build

  test:
    name: Test Application
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Start MySQL Container
        run: docker compose up -d db

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL..."

          for i in {1..30}; do
            if docker compose exec -T db mysqladmin ping -h localhost -uroot -proot --silent; then
              echo "MySQL is ready!"
              exit 0
            fi

            echo "MySQL is not ready yet..."
            sleep 2
          done

          echo "MySQL failed to start."
          exit 1

      - name: Run Tests
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASSWORD: "root"
          DB_NAME: "blood_bank"
        run: npm test

      - name: Stop Docker Stack
        if: always()
        run: docker compose down -v